<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — LeadDashboard</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/responsivo.css">
</head>

<body class="pagina-login">

<div class="fundo-grid" aria-hidden="true"></div>

<main class="login-container">

    <div class="login-card">

        <div class="login-topo">
            <div class="login-logo" aria-hidden="true">
                <svg viewBox="0 0 32 32"><path d="M16 2 28 9v14L16 30 4 23V9Z"/><path d="M11 11v10h9"/></svg>
            </div>
            <h1>Lead<span>Dashboard</span></h1>
            <p>// criar conta</p>
        </div>

        <form id="formCadastro" class="login-form" novalidate>

            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" maxlength="80" autocomplete="name" placeholder="Seu nome" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" maxlength="160" autocomplete="email" placeholder="voce@empresa.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required>
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" maxlength="128" autocomplete="new-password" placeholder="Repita a senha" required>
            </div>

            <div class="form-group">
                <label id="labelTipo">Tipo de conta</label>
                <div class="seletor-tipo" role="radiogroup" aria-labelledby="labelTipo">
                    <button type="button" class="opcao-tipo ativo" data-tipo="USUARIO" role="radio" aria-checked="true">
                        <span class="opcao-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span>
                        <span class="opcao-titulo">Usuário</span>
                        <span class="opcao-desc">Uso pessoal</span>
                    </button>
                    <button type="button" class="opcao-tipo" data-tipo="EMPRESA" role="radio" aria-checked="false">
                        <span class="opcao-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></svg></span>
                        <span class="opcao-titulo">Empresa</span>
                        <span class="opcao-desc">Para a sua equipe</span>
                    </button>
                </div>
            </div>

            <div class="form-group" id="grupoNomeEspaco" style="display:none;">
                <label for="nomeEspaco">Nome da empresa</label>
                <input type="text" id="nomeEspaco" maxlength="80" autocomplete="organization" placeholder="Ex.: Minha Empresa">
            </div>

            <p class="login-dica">
                Sua conta já vem com um espaço próprio de leads. Para acessar os leads de outra empresa,
                depois de entrar use o <strong>token de convite</strong> dela em "Equipe e convite".
            </p>

            <div class="form-erro" id="cadastroErro" style="display:none;"></div>

            <button type="submit" class="btn-auth" id="btnCadastrar">Criar conta</button>

        </form>

        <p class="login-rodape">
            Já tem conta? <a href="/login">Entrar</a>
        </p>

    </div>

</main>

<script src="/js/cadastro.js"></script>

</body>
</html>
