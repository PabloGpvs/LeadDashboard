<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — LeadDashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/responsivo.css">
</head>

<body class="pagina-login">

<div class="fundo-grid" aria-hidden="true"></div>

<main class="login-container">

    <div class="login-card">

        <div class="login-topo">
            <div class="login-logo" aria-hidden="true">
                <svg viewBox="0 0 32 32"><path d="M16 2 28 9v14L16 30 4 23V9Z"/><path d="M11 11v10h9"/></svg>
            </div>
            <h1>Lead<span>Dashboard</span></h1>
            <p>// acesso ao sistema</p>
        </div>

        <form id="formLogin" class="login-form">

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="username" placeholder="voce@empresa.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required>
            </div>

            <div class="form-erro" id="loginErro" style="display:none;"></div>

            <button type="submit" class="btn-auth" id="btnEntrar">Entrar</button>

        </form>

        <p class="login-rodape">
            Não tem conta? <a href="/cadastro">Criar conta</a>
        </p>

    </div>

</main>

<script src="/js/login.js"></script>

</body>
</html>
